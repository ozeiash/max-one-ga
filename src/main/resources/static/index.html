<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Max One - Algoritmo Genético</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 24px;
        }

        h1 {
            margin-top: 0;
            font-size: 2.2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: var(--text);
        }

        input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
        }

        button {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .result {
            margin-top: 30px;
            padding: 18px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .result h3 {
            margin-top: 0;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 700;
            margin-top: 10px;
        }

        .success {
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
        }

        .error {
            background: rgba(239, 68, 68, 0.12);
            color: var(--danger);
        }

        pre {
            background: #111827;
            color: #e5e7eb;
            padding: 16px;
            border-radius: 12px;
            overflow: auto;
        }

        .footer-note {
            margin-top: 18px;
            font-size: 0.9rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Max One - Algoritmo Genético</h1>

            <form id="gaForm">
                <div class="grid">
                    <div class="field">
                        <label for="geneLength">geneLength</label>
                        <input id="geneLength" type="number" value="20" min="1" />
                    </div>

                    <div class="field">
                        <label for="populationSize">populationSize</label>
                        <input id="populationSize" type="number" value="100" min="2" />
                    </div>

                    <div class="field">
                        <label for="maxGenerations">maxGenerations</label>
                        <input id="maxGenerations" type="number" value="500" min="1" />
                    </div>

                    <div class="field">
                        <label for="mutationRate">mutationRate</label>
                        <input id="mutationRate" type="number" value="0.05" min="0" max="1" step="0.01" />
                    </div>

                    <div class="field">
                        <label for="crossoverRate">crossoverRate</label>
                        <input id="crossoverRate" type="number" value="0.9" min="0" max="1" step="0.01" />
                    </div>

                    <div class="field">
                        <label for="eliteCount">eliteCount</label>
                        <input id="eliteCount" type="number" value="2" min="1" />
                    </div>
                </div>

                <button type="submit">Executar AG</button>
            </form>

            <div class="result" id="resultBox">
                <h3>Resultado</h3>
                <p>Preencha os parâmetros e execute o algoritmo.</p>
            </div>

            <div class="footer-note">
                A solução ótima do problema Max One é uma string com todos os bits iguais a 1.
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('gaForm');
        const resultBox = document.getElementById('resultBox');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const requestBody = {
                geneLength: Number(document.getElementById('geneLength').value),
                populationSize: Number(document.getElementById('populationSize').value),
                maxGenerations: Number(document.getElementById('maxGenerations').value),
                mutationRate: Number(document.getElementById('mutationRate').value),
                crossoverRate: Number(document.getElementById('crossoverRate').value),
                eliteCount: Number(document.getElementById('eliteCount').value)
            };

            resultBox.innerHTML = '<h3>Processando...</h3><p>Executando algoritmo genético...</p>';

            try {
                const response = await fetch('/api/ga/max-one', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (!response.ok) {
                    const msg = data.errors ? JSON.stringify(data.errors, null, 2) : data.error || 'Erro desconhecido';
                    throw new Error(msg);
                }

                resultBox.innerHTML = `
                    <h3>Resultado</h3>
                    <div class="badge success">Sucesso</div>
                    <p><strong>Melhor gene:</strong> ${data.bestGenes}</p>
                    <p><strong>Fitness:</strong> ${data.bestFitness}</p>
                    <p><strong>Gerações executadas:</strong> ${data.generationsExecuted}</p>
                    <p><strong>Tamanho da solução:</strong> ${data.solutionLength}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultBox.innerHTML = `
                    <h3>Erro</h3>
                    <div class="badge error">Falha</div>
                    <pre>${error.message}</pre>
                `;
            }
        });
    </script>
</body>
</html>
